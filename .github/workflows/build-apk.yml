name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Runs in seconds, before the slow Flutter setup, so a missing file is
      # reported immediately rather than four minutes in.
      - name: Verify project files
        run: python3 .github/scripts/verify_files.py

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter 3.27 is the oldest stable that satisfies the plugin versions in
      # pubspec.yaml (firebase 3.x, geolocator 13.x, local_notifications 18.x).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ------------------------------------------------------------------
      # Generate the native Android project.
      #
      # This repo holds only lib/, pubspec.yaml and assets. The android/ folder
      # is machine-generated, so it is built here on every run rather than
      # committed. `flutter create` never touches lib/.
      # ------------------------------------------------------------------
      - name: Generate Android project
        run: flutter create --platforms=android --org com.mistrio --project-name mistrio .

      - name: Configure Android project
        run: python3 .github/scripts/configure_android.py

      - name: Show generated Gradle config
        run: |
          echo "--------- android/app/build.gradle ---------"
          cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts
          echo ""
          echo "--------- tail of android/build.gradle ---------"
          tail -25 android/build.gradle 2>/dev/null || tail -25 android/build.gradle.kts

      - name: Inject Maps API key
        run: |
          sed -i "s|MAPS_KEY_PLACEHOLDER|${{ secrets.MAPS_API_KEY }}|g" \
            android/app/src/main/AndroidManifest.xml

      # ------------------------------------------------------------------
      # Secrets
      # ------------------------------------------------------------------
      - name: Restore Firebase config
        run: |
          cat > android/app/google-services.json <<'JSON'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          JSON
          python3 .github/scripts/check_google_services.py

      # The same keystore on every build keeps the SHA-1 registered in Firebase
      # valid, which is what makes Phone Auth work on CI builds.
      - name: Restore keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > android/app/debug.keystore
            echo "Using the shared keystore from secrets"
          else
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::DEBUG_KEYSTORE secret is missing. A throwaway keystore was generated, so this APK's SHA-1 will not match Firebase and phone login will fail. Copy the SHA-1 printed below into Firebase."
          fi

      - name: Print SHA-1
        run: |
          keytool -list -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android | grep -A1 SHA1 || true

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos || true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mistrio-user-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
