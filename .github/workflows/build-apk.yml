name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Runs in seconds, before the slow Flutter setup, so a missing file is
      # reported immediately rather than four minutes in.
      - name: Verify project files
        run: python3 .github/scripts/verify_files.py

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter 3.27 is the oldest stable that satisfies the plugin versions in
      # pubspec.yaml (firebase 3.x, geolocator 13.x, local_notifications 18.x).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # ------------------------------------------------------------------
      # Generate the native Android project.
      #
      # This repo holds only lib/, pubspec.yaml and assets. The android/ folder
      # is machine-generated, so it is built here on every run rather than
      # committed. `flutter create` never touches lib/.
      # ------------------------------------------------------------------
      - name: Generate Android project
        run: flutter create --platforms=android --org com.mistrio --project-name mistrio .

      - name: Configure Android project
        run: python3 .github/scripts/configure_android.py

      - name: Show generated Android config
        run: |
          echo "--------- android/app/build.gradle ---------"
          cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts
          echo ""
          echo "--------- head of android/build.gradle ---------"
          head -30 android/build.gradle 2>/dev/null || head -30 android/build.gradle.kts
          echo ""
          echo "--------- AndroidManifest.xml ---------"
          cat android/app/src/main/AndroidManifest.xml
          echo ""
          echo "--------- MainActivity location ---------"
          # The package here must match applicationId, or the app installs but
          # crashes with ClassNotFoundException the moment it is opened.
          find android/app/src/main/kotlin android/app/src/main/java -type f 2>/dev/null || true

      - name: Inject Maps API key
        run: |
          sed -i "s|MAPS_KEY_PLACEHOLDER|${{ secrets.MAPS_API_KEY }}|g" \
            android/app/src/main/AndroidManifest.xml

      # ------------------------------------------------------------------
      # Secrets
      # ------------------------------------------------------------------
      - name: Restore Firebase config
        run: |
          cat > android/app/google-services.json <<'JSON'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          JSON
          python3 .github/scripts/check_google_services.py

      # The same keystore on every build keeps the SHA-1 registered in Firebase
      # valid, which is what makes Phone Auth work on CI builds.
      # The signing key decides the APK's SHA-1, which Firebase checks on every
      # phone login. A new key each build means a new fingerprint each build,
      # and login breaks until Firebase is updated again. Storing one key as a
      # secret keeps the fingerprint stable.
      - name: Restore keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > android/app/debug.keystore
            echo "Using the shared keystore from the DEBUG_KEYSTORE secret."
            echo "KEYSTORE_IS_TEMPORARY=false" >> $GITHUB_ENV
          else
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_IS_TEMPORARY=true" >> $GITHUB_ENV
            echo "::warning::No DEBUG_KEYSTORE secret, so a throwaway key was generated. This build's SHA-1 will differ from every other build. Download the 'keystore-secret' artifact from this run to make it permanent."
          fi

      - name: Print SHA-1
        run: |
          echo "Register this fingerprint in Firebase Console:"
          echo "  Project settings > Your apps > com.mistrio.user > Add fingerprint"
          echo ""
          keytool -list -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            | grep -A1 "SHA1" || true

      # Written out only when a temporary key was generated, so the value can
      # be saved as a secret without needing a terminal on your machine.
      - name: Export keystore for the DEBUG_KEYSTORE secret
        if: env.KEYSTORE_IS_TEMPORARY == 'true'
        run: |
          mkdir -p keystore-out
          base64 -w0 android/app/debug.keystore > keystore-out/DEBUG_KEYSTORE.txt
          keytool -list -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android \
            | grep "SHA1" > keystore-out/SHA1.txt || true
          cat > keystore-out/HOW_TO_USE.txt <<'GUIDE'
          Making this build's signing key permanent
          =========================================

          Right now every build creates a new signing key, so the SHA-1 that
          Firebase checks changes each time and phone login breaks after every
          rebuild.

          Fixing it, once:

          1. Open DEBUG_KEYSTORE.txt in this folder and copy the whole line.
             It is one long line of letters and numbers with no spaces.

          2. On github.com, in this repository:
                Settings > Secrets and variables > Actions
                New repository secret
                Name:  DEBUG_KEYSTORE
                Value: the line you copied
                Add secret

          3. Open SHA1.txt in this folder and copy the fingerprint.

          4. In Firebase Console:
                Project settings > Your apps > com.mistrio.user
                Add fingerprint
                Paste it, Save

          From then on every build reuses this key, the fingerprint stays the
          same, and login keeps working without touching Firebase again.

          Do the same for the partner app repository, using the same
          DEBUG_KEYSTORE value, and register the same fingerprint against
          com.mistrio.partner. One key can serve both apps.

          Keep this file private. Anyone holding it can sign an APK that
          Android will treat as an update to yours.
          GUIDE
          echo "Written. Download the 'keystore-secret' artifact from this run."

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_IS_TEMPORARY == 'true'
        with:
          name: keystore-secret
          path: keystore-out/
          retention-days: 7

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - run: flutter pub get

      # Regenerates every mipmap density from assets/icon/. Must run after
      # `flutter create`, since it writes into android/app/src/main/res/.
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - run: flutter analyze --no-fatal-infos || true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mistrio-user-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
