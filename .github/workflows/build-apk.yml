name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # ------------------------------------------------------------------
      # Generate the native Android project.
      #
      # This repo only holds lib/, pubspec.yaml and assets. The android/
      # folder is machine-generated, so we build it here on every run rather
      # than committing it. `flutter create` never touches lib/.
      # ------------------------------------------------------------------
      - name: Generate Android project
        run: flutter create --platforms=android --org com.mistrio --project-name mistrio .

      # ------------------------------------------------------------------
      # Apply the Mistrio-specific Android configuration.
      # ------------------------------------------------------------------
      - name: Configure Android project
        run: |
          python3 - <<'PYTHON'
          import re, pathlib

          APP_ID = "com.mistrio.user"
          APP_LABEL = "Mistrio"

          # ---------- settings.gradle: register the Google Services plugin ----------
          for name in ("settings.gradle", "settings.gradle.kts"):
              p = pathlib.Path("android") / name
              if not p.exists():
                  continue
              s = p.read_text()
              if "com.google.gms.google-services" not in s:
                  s = re.sub(
                      r'(id\s+["\']com\.android\.application["\'][^\n]*\n)',
                      r'\1    id "com.google.gms.google-services" version "4.4.2" apply false\n',
                      s,
                      count=1,
                  )
                  p.write_text(s)
                  print("patched", p)

          # ---------- app/build.gradle ----------
          app = None
          for name in ("build.gradle", "build.gradle.kts"):
              cand = pathlib.Path("android/app") / name
              if cand.exists():
                  app = cand
                  break
          assert app, "android/app/build.gradle not found"

          s = app.read_text()

          if "com.google.gms.google-services" not in s:
              if re.search(r'id\s+["\']dev\.flutter\.flutter-gradle-plugin["\']', s):
                  s = re.sub(
                      r'(id\s+["\']dev\.flutter\.flutter-gradle-plugin["\'][^\n]*\n)',
                      r'\1    id "com.google.gms.google-services"\n',
                      s,
                      count=1,
                  )
              else:
                  s += '\napply plugin: "com.google.gms.google-services"\n'

          s = re.sub(r'namespace\s*=?\s*["\'][^"\']+["\']', 'namespace = "%s"' % APP_ID, s)
          s = re.sub(r'applicationId\s*=?\s*["\'][^"\']+["\']', 'applicationId = "%s"' % APP_ID, s)

          # firebase_auth needs 23+
          s = re.sub(r'minSdk\s*=?\s*[^\n]+', 'minSdk = 23', s)
          s = re.sub(r'targetSdk\s*=?\s*[^\n]+', 'targetSdk = 34', s)
          s = re.sub(r'compileSdk\s*=?\s*[^\n]+', 'compileSdk = 34', s)

          if "multiDexEnabled" not in s:
              s = re.sub(
                  r'(applicationId\s*=\s*["\'][^"\']+["\']\n)',
                  r'\1        multiDexEnabled = true\n',
                  s,
                  count=1,
              )

          # Sign release with the debug keystore so one SHA-1 covers every
          # build during testing. Swap for a real upload key before production.
          if "signingConfigs" not in s:
              s = re.sub(
                  r'(\n\s*buildTypes\s*\{)',
                  '\n    signingConfigs {\n'
                  '        debug {\n'
                  '            storeFile file("debug.keystore")\n'
                  '            storePassword "android"\n'
                  '            keyAlias "androiddebugkey"\n'
                  '            keyPassword "android"\n'
                  '        }\n'
                  '    }\n'
                  r'\1',
                  s,
                  count=1,
              )

          s = re.sub(
              r'signingConfig\s*=?\s*signingConfigs\.debug',
              'signingConfig signingConfigs.debug',
              s,
          )

          app.write_text(s)
          print("patched", app)

          # ---------- AndroidManifest.xml ----------
          man = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = man.read_text()

          perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.CAMERA",
          ]
          block = "\n".join(
              '    <uses-permission android:name="%s"/>' % p
              for p in perms if p not in s
          )
          if block:
              s = re.sub(r'(<manifest[^>]*>\n)', r'\1' + block + "\n", s, count=1)

          s = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % APP_LABEL, s, count=1)

          if "com.google.android.geo.API_KEY" not in s:
              s = re.sub(
                  r'(\n\s*</application>)',
                  '\n        <meta-data\n'
                  '            android:name="com.google.android.geo.API_KEY"\n'
                  '            android:value="MAPS_KEY_PLACEHOLDER"/>'
                  r'\1',
                  s,
                  count=1,
              )

          man.write_text(s)
          print("patched", man)
          PYTHON

      - name: Inject Maps API key
        run: |
          sed -i "s|MAPS_KEY_PLACEHOLDER|${{ secrets.MAPS_API_KEY }}|g" \
            android/app/src/main/AndroidManifest.xml

      # ------------------------------------------------------------------
      # Secrets
      # ------------------------------------------------------------------
      - name: Restore Firebase config
        run: |
          cat > android/app/google-services.json <<'JSON'
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          JSON
          python3 -c "import json;json.load(open('android/app/google-services.json'));print('google-services.json is valid')"

      # The same keystore on every build keeps the SHA-1 registered in
      # Firebase valid, which is what makes Phone Auth work on CI builds.
      - name: Restore keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > android/app/debug.keystore
            echo "Using the shared keystore from secrets"
          else
            keytool -genkey -v -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::DEBUG_KEYSTORE secret is missing. A throwaway keystore was generated, so this APK's SHA-1 will not match Firebase and phone login will fail. Copy the SHA-1 printed below into Firebase."
          fi

      - name: Print SHA-1
        run: |
          keytool -list -v -keystore android/app/debug.keystore \
            -alias androiddebugkey -storepass android -keypass android | grep -A1 SHA1 || true

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos || true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mistrio-user-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
